[project]
name = "stellis"
version = "0.1.0"
description = "Record, transcribe, and search conversations on your computer"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "dash==4.4.1",
    "dash-mantine-components==2.8.1",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg==0.6.0",
    "numpy>=2.5.4",
    "pillow==13.0.0",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.32",
    "pywhispercpp==1.5.1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundfile>=0.13.1,<0.14",
    "uvicorn>=0.54.0",
    "websockets>=15.0.1",
]

[project.scripts]
stellis = "stellis:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
