<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Stellis account</title><link rel="stylesheet" href="/static/style.css" /><script src="/shared/sync-crypto.js" defer></script><script src="/shared/snapshot-format.js" defer></script><script src="/static/app.js" defer></script><script src="/static/vault.js" defer></script></head><body><header><strong>stellis</strong><button id="logout" hidden>Log out</button></header><main><section id="sign-in"><h1>Sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required minlength="3" /></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="12" /></label><button type="submit">Sign in</button></form><button id="show-register" type="button">Sign up</button></section><section id="account" hidden><h1>Account</h1><p id="username"></p><div id="vault"><h2>Encrypted notes</h2><form id="vault-form"><label>Vault passphrase<input id="vault-passphrase" type="password" autocomplete="off" required minlength="12" /></label><button type="submit">Unlock vault</button></form><div id="vault-open" hidden><form id="note-form"><label>Note<textarea id="note-text" required maxlength="2000"></textarea></label><button type="submit">Save encrypted</button></form><button id="vault-sync" type="button">Sync</button><ul id="notes"></ul></div><p id="vault-status" role="status"></p></div><h2>Devices</h2><form id="device-form"><label>Device name<input name="name" required maxlength="100" /></label><button type="submit">Add device</button></form><ul id="devices"></ul><button id="revoke-all" type="button">Log out everywhere</button></section><p id="message" role="status"></p></main></body></html>
